# Caddy reverse-proxy stack for vibestart - the only stack with ports
# published to the internet. Owns the shared `edge` Docker network that
# infra/supabase's kong service (and, from T5, backend) attach to as
# external. See README.md for the topology and first-run runbook.
#
# Usage:
#   cp .env.example .env   # fill in real domains + ACME email
#   docker compose up -d   # from this directory (or `make edge-up`)

name: edge

services:
  caddy:
    container_name: edge-caddy
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      APP_DOMAIN: ${APP_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Static builds, read-only - Caddy only ever serves these, never
      # writes them. Bind mounts (not named volumes) so `webapp`/`website`
      # builds land here directly from the repo checkout on the VPS. They
      # may not exist yet (T6/T7 not built) - Docker creates empty dirs on
      # first `up`, and Caddy just 404s until a build is deployed there.
      - ../../webapp/dist:/srv/webapp:ro
      - ../../website/dist:/srv/website:ro
      # ACME account/cert material and Caddy's runtime config/OCSP state.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # 127.0.0.1, not localhost: the admin API binds to the IPv4 loopback
      # only, and "localhost" resolves to ::1 first inside the container,
      # which wget can't connect to.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge

networks:
  # Owned here (fixed name, not project-prefixed) so other compose projects
  # (infra/supabase's kong, and backend from T5) can join it as external.
  edge:
    name: edge

volumes:
  caddy-data:
  caddy-config:
