# Caddy reverse-proxy stack for vibestart - the only stack with ports
# published to the internet. Attaches to the shared `edge` Docker network
# (to reach infra/supabase's `kong`) and the narrower `app_edge` network
# (to reach infra/app's `backend`, without putting `backend` on the same
# broad `edge` network kong and any future service also join - see
# infra/app/README.md, "Network segmentation") as external - both networks
# are provisioned independently (`make ensure-network` /
# `docker network create edge` / `docker network create app_edge`), not
# owned by this stack. See README.md for the topology and first-run runbook.
#
# Static build roots are bind-mounted through the STABLE `releases/` parent
# directory (not through a symlink as the bind source itself - a bind mount
# resolves a symlinked source once, at container start, so a later symlink
# flip would silently go unnoticed without a container recreate). Instead,
# `../../releases` (real, never-replaced directory) is mounted whole, and
# `releases/current` - the symlink .github/workflows/deploy.yml's release
# process flips atomically after a new backend passes its healthcheck, see
# docs/DEPLOYMENT.md, "Release layout on the VPS" - lives *inside* that
# mounted tree. Caddy's `file_server` re-resolves `current` on every
# request (an ordinary in-container symlink lookup, not a new host mount),
# so a new release's static files show up with no action needed here; only
# a Caddyfile/env change needs `docker compose up` again in this directory.
#
# Usage:
#   cp .env.example .env   # fill in real domains + ACME email
#   docker compose up -d   # from this directory (or `make edge-up`)

name: edge

services:
  caddy:
    container_name: edge-caddy
    image: caddy:2.11.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      # `:?...` enforces these at `docker compose config`/`up` time - fail
      # fast with a clear message instead of Caddy starting with blank
      # domains and silently misrouting.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN:?SUPABASE_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Static builds, read-only - Caddy only ever serves these, never
      # writes them. `../../releases` is the STABLE parent directory the
      # deploy workflow writes every versioned release into
      # (`releases/<sha>/{webapp,website}/dist`) plus the `releases/current`
      # symlink it flips after a successful backend healthcheck - see the
      # comment above and docs/DEPLOYMENT.md, "Release layout on the VPS".
      # `create_host_path: false` means this directory must already exist
      # (created by the deploy checklist / `make edge-up`'s mkdir) - Compose
      # refuses to silently create it, so a missing release directory fails
      # loudly instead of masking a broken deploy as an empty mount.
      - type: bind
        source: ../../releases
        target: /srv
        read_only: true
        bind:
          create_host_path: false
      # ACME account/cert material and Caddy's runtime config/OCSP state.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # 127.0.0.1, not localhost: the admin API binds to the IPv4 loopback
      # only, and "localhost" resolves to ::1 first inside the container,
      # which wget can't connect to.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edge
      - app_edge

networks:
  # Provisioned independently of any single stack (`make ensure-network` /
  # `docker network create edge`) so infra/supabase's kong service and this
  # stack can attach to it as external in any start/stop order - no stack
  # owns or creates it anymore. `backend` (infra/app) deliberately does NOT
  # join this network - see `app_edge` below.
  edge:
    external: true
    name: edge
  # Narrow network shared by exactly this `caddy` service and infra/app's
  # `backend` - see infra/app/README.md, "Network segmentation", for why
  # backend isn't on the broad `edge` network above instead.
  app_edge:
    external: true
    name: app_edge

volumes:
  caddy-data:
  caddy-config:
